name: Telemetry Map & Chart Pipeline

on:
  schedule:
    - cron: '0 21 * * *' # Daily at 21:00 UTC / 00:00 EAT
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install folium matplotlib numpy pandas pytest

      - name: Run Pytest Validation Suite
        run: |
          PYTHONPATH=. pytest -v

      - name: Generate Telemetry Map & Preview Artifacts
        run: |
          python src/visualize.py
          touch docs/.nojekyll

      - name: Commit and Push Generated Artifacts
        run: |
          git config --global user.name "jamesruga"
          git config --global user.email "jamesruga07@gmail.com"
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update route telemetry map and preview artifacts [skip ci]" && git push)

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
