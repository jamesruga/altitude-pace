name: AltitudePace Telemetry & Map Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          PYTHONPATH=. pytest -v

      - name: Process Telemetry & Render Map
        run: |
          python src/dataset.py
          PYTHONPATH=. python src/visualize.py

      - name: Commit and Push Interactive Map Artifacts
        run: |
          git config --local user.email "jamesruga07@gmail.com"
          git config --local user.name "jamesruga"
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update telemetry map artifacts [skip ci]" && git push)
